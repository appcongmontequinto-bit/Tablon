/* ─────────── Exportar a Excel ─────────── */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar la librería de Excel'));
    document.head.appendChild(s);
  });
}
const XS = {
  title: { font: { bold: true, sz: 14, color: { rgb: '1F4E79' } } },
  head: { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1F4E79' } },
          alignment: { vertical: 'center', wrapText: true } },
  total: { font: { bold: true }, fill: { fgColor: { rgb: 'E6EEF7' } } },
  pend: { font: { italic: true, color: { rgb: 'B36B00' } }, fill: { fgColor: { rgb: 'FFF2DC' } } }
};
const tipoPub = r => r.regular === 'si' ? 'Precursor regular' : r.auxiliar === 'si' ? 'Precursor auxiliar' : 'Publicador';
const byGrupoNombre = (a, b) => ((a.grupo || '') + a.nombre).localeCompare((b.grupo || '') + b.nombre, 'es');

function calcResumen(reports) {
  const yes = reports.filter(r => r.participo === 'si');
  const sum = (a, k) => a.reduce((t, r) => t + num(r[k]), 0);
  const pub = yes.filter(r => r.regular !== 'si' && r.auxiliar !== 'si');
  const aux = yes.filter(r => r.auxiliar === 'si');
  const reg = yes.filter(r => r.regular === 'si');
  return {
    pub: [pub.length, sum(pub, 'cursos')],
    aux: [aux.length, sum(aux, 'cursos'), sum(aux, 'horas')],
    reg: [reg.length, sum(reg, 'cursos'), sum(reg, 'horas')],
    cursos: sum(yes, 'cursos')
  };
}

function makeSheet(rows, { widths = [], head = [], rowStyles = {}, filterFrom = null, title = true } = {}) {
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = widths.map(w => ({ wch: w }));
  const R = XLSX.utils.decode_range(ws['!ref']);
  for (let r = R.s.r; r <= R.e.r; r++) {
    const st = head.includes(r) ? XS.head : rowStyles[r];
    if (!st) continue;
    for (let c = R.s.c; c <= R.e.c; c++) {
      const a = XLSX.utils.encode_cell({ r, c });
      if (!ws[a]) ws[a] = { t: 's', v: '' };
      ws[a].s = st;
    }
  }
  if (title && ws.A1) ws.A1.s = XS.title;
  if (filterFrom !== null) ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: filterFrom, c: 0 }, e: { r: R.e.r, c: R.e.c } }) };
  return ws;
}

async function exportMes(ps, reports, pend, mes, sufijo = '') {
  await loadXLSX();
  const R = calcResumen(reports);
  const grupos = [...new Set(ps.map(p => p.grupo || 'Sin grupo'))].sort((a, b) => a.localeCompare(b, 'es'));
  const repIds = new Set(reports.map(r => r.pubId));

  const res = [
    [`Informes de ${mesLabel(mes)}${sufijo} — ${CONGREGACION}`], [],
    ['Categoría', 'Informes', 'Cursos bíblicos', 'Horas'],
    ['Publicadores', R.pub[0], R.pub[1], ''],
    ['Precursores auxiliares', ...R.aux],
    ['Precursores regulares', ...R.reg],
    ['Total', R.pub[0] + R.aux[0] + R.reg[0], R.cursos, R.aux[2] + R.reg[2]],
    [],
    ['Por grupo', 'Recibidos', 'Publicadores', 'Pendientes']
  ];
  const grupoHead = res.length - 1;
  grupos.forEach(g => {
    const miembros = ps.filter(p => (p.grupo || 'Sin grupo') === g);
    const rec = miembros.filter(p => repIds.has(p.id)).length;
    res.push([g, rec, miembros.length, miembros.length - rec]);
  });
  res.push(['Total', reports.length, ps.length, pend.length]);
  const wsRes = makeSheet(res, { widths: [26, 12, 16, 12], head: [2, grupoHead],
    rowStyles: { 6: XS.total, [res.length - 1]: XS.total } });

  const det = [['Grupo', 'Nombre', 'Tipo', 'Participó', 'Cursos bíblicos', 'Horas', 'Comentarios', 'Enviado']];
  const detStyles = {};
  const todosGrupos = [...new Set([...grupos, ...reports.map(r => r.grupo || 'Sin grupo')])];
  todosGrupos.forEach(g => {
    reports.filter(r => (r.grupo || 'Sin grupo') === g).sort(byGrupoNombre).forEach(r => {
      const pionero = r.regular === 'si' || r.auxiliar === 'si';
      det.push([g, r.nombre, tipoPub(r), r.participo === 'si' ? 'Sí' : 'No', num(r.cursos),
        pionero ? num(r.horas) : '', r.comentarios || '',
        r.actualizado ? new Date(r.actualizado).toLocaleDateString('es-ES') : '']);
    });
    pend.filter(p => (p.grupo || 'Sin grupo') === g).sort(byGrupoNombre).forEach(p => {
      detStyles[det.length] = XS.pend;
      det.push([g, p.nombre, p.precursor === 'si' ? 'Precursor regular' : '', 'PENDIENTE', '', '', '', '']);
    });
  });
  const wsDet = makeSheet(det, { widths: [14, 28, 18, 11, 14, 8, 40, 12], head: [0], rowStyles: detStyles, filterFrom: 0, title: false });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen');
  XLSX.utils.book_append_sheet(wb, wsDet, 'Detalle');
  XLSX.writeFile(wb, `Informes ${mesLabel(mes)}${sufijo}.xlsx`);
}

/** loader(desde, hasta) → { pubs, reports } en el formato de cargarDatos */
async function exportAnio(mes, loader) {
  const [y, m] = mes.split('-').map(Number);
  const startY = m >= 9 ? y : y - 1; // el año de servicio va de septiembre a agosto
  const meses = Array.from({ length: 12 }, (_, i) => {
    const mm = (8 + i) % 12 + 1;
    return `${mm >= 9 ? startY : startY + 1}-${String(mm).padStart(2, '0')}`;
  });
  const [{ pubs: ps, reports }] = await Promise.all([loader(meses[0], meses[11]), loadXLSX()]);
  const corto = mm => MESES[+mm.slice(5) - 1].slice(0, 3);

  const res = [[`Año de servicio ${startY}-${startY + 1} — ${CONGREGACION}`], [],
    ['Mes', 'Informes', 'Publicadores', 'Cursos publ.', 'Prec. auxiliares', 'Horas aux.', 'Prec. regulares', 'Horas reg.', 'Cursos total']];
  const tot = Array(8).fill(0);
  meses.forEach(mm => {
    const rs = reports.filter(r => r.mes === mm);
    const R = calcResumen(rs);
    const fila = [rs.length, R.pub[0], R.pub[1], R.aux[0], R.aux[2], R.reg[0], R.reg[2], R.cursos];
    fila.forEach((v, i) => { tot[i] += v; });
    res.push([mesLabel(mm), ...(rs.length ? fila : Array(8).fill(''))]);
  });
  res.push(['Total', ...tot]);
  const wsRes = makeSheet(res, { widths: [18, 10, 13, 12, 15, 11, 15, 11, 12], head: [2], rowStyles: { [res.length - 1]: XS.total } });

  const idx = {};
  reports.forEach(r => { idx[r.pubId + '|' + r.mes] = r; });
  const personas = [...ps];
  reports.forEach(r => {
    if (!personas.some(p => p.id === r.pubId)) personas.push({ id: r.pubId, nombre: r.nombre + ' (baja)', grupo: r.grupo });
  });
  personas.sort(byGrupoNombre);
  const pp = [['Grupo', 'Nombre', ...meses.map(corto), 'Meses informados', 'Cursos (total)', 'Horas (total)']];
  personas.forEach(p => {
    let n = 0, cursos = 0, horas = 0;
    const celdas = meses.map(mm => {
      const r = idx[p.id + '|' + mm];
      if (!r) return '';
      n++; cursos += num(r.cursos); horas += num(r.horas);
      if (r.participo !== 'si') return 'No';
      if (r.regular === 'si') return num(r.horas);
      if (r.auxiliar === 'si') return num(r.horas) + ' A';
      return '✓';
    });
    pp.push([p.grupo || '', p.nombre, ...celdas, n, cursos, horas || '']);
  });
  const wsPP = makeSheet(pp, { widths: [12, 26, ...Array(12).fill(6), 10, 10, 10], head: [0], filterFrom: 0, title: false });

  const reg = [['Nombre', 'Grupo', 'Mes', 'Tipo', 'Participó', 'Cursos bíblicos', 'Horas', 'Comentarios']];
  reports.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es') || a.mes.localeCompare(b.mes)).forEach(r => {
    reg.push([r.nombre, r.grupo, mesLabel(r.mes), tipoPub(r), r.participo === 'si' ? 'Sí' : 'No', num(r.cursos),
      (r.regular === 'si' || r.auxiliar === 'si') ? num(r.horas) : '', r.comentarios || '']);
  });
  const wsReg = makeSheet(reg, { widths: [26, 12, 16, 18, 10, 14, 8, 40], head: [0], filterFrom: 0, title: false });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen anual');
  XLSX.utils.book_append_sheet(wb, wsPP, 'Por publicador');
  XLSX.utils.book_append_sheet(wb, wsReg, 'Registro');
  XLSX.writeFile(wb, `Informes año de servicio ${startY}-${startY + 1}.xlsx`);
}

if (!redirigiendo) { boot(); pintarInstalar(); }
