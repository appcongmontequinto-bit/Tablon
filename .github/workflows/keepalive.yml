# Evita que Supabase pause el proyecto gratuito por inactividad (se pausa tras 7 días sin uso).
# Hace una consulta mínima cada 3 días. Necesita dos secretos en el repo:
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL  = https://TU-PROYECTO.supabase.co
#     SUPABASE_KEY  = la clave pública (anon / publishable)
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/mi_perfil" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "Respuesta: $code"
          test "$code" -lt 500
